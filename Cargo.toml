[package]
name = "computeruse"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Global input capture and vision-guided control for modern Ubuntu, written in Rust"
license = "MIT"
repository = "https://github.com/AI10xDev/computeruse"
readme = "README.md"
keywords = ["keyboard", "input", "uinput", "evdev", "automation"]
categories = ["hardware-support", "command-line-utilities"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
evdev = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
x11rb = "0.13"
