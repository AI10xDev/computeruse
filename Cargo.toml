[package]
name = "computeruse"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Global mouse capture and control for modern Ubuntu, written in Rust"
license = "MIT"
repository = "https://github.com/AI10xDev/computeruse"
readme = "README.md"
keywords = ["mouse", "input", "uinput", "evdev", "automation"]
categories = ["hardware-support", "command-line-utilities"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
evdev = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
