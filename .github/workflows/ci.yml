name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: cargo doc --no-deps

  ubuntu-26-04:
    name: Ubuntu 26.04 build
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install --yes ca-certificates curl gcc git
      - uses: actions/checkout@v4
      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --profile minimal --default-toolchain stable -y
      - name: Test
        run: $HOME/.cargo/bin/cargo test --locked --all-targets
