name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Rust quality checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: cargo doc --no-deps
      - name: Installer and Wayland launcher tests
        run: |
          bash -n scripts/install-arch-wayland.sh
          python3 -B -m unittest discover -s tests -p 'test_*.py' -v

  arch-linux:
    name: Arch Linux build (no compositor)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install dependencies with a full upgrade
        run: pacman -Syu --noconfirm --needed git rust python grim ffmpeg
      - uses: actions/checkout@v5
      - run: cargo test --locked --all-targets --all-features
      - run: python -B -m unittest discover -s tests -p 'test_*.py' -v

  ubuntu-26-04:
    name: Ubuntu 26.04 build
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install --yes ca-certificates curl gcc git
      - uses: actions/checkout@v5
      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --profile minimal --default-toolchain stable -y
      - name: Test
        run: $HOME/.cargo/bin/cargo test --locked --all-targets
